name: Tests
on:
  push:
  pull_request:
jobs:
  helper:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_db_only
          POSTGRES_DB: helper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d helper_test"
          --health-interval 5s --health-timeout 4s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test_db_only@127.0.0.1:5432/helper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests -v
      - run: sh -n deploy/install_worker.sh
